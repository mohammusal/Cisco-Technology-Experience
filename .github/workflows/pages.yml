name: Publish the guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish pushes one after another; never cut off a deploy that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install MkDocs and plugins
        run: pip install -r requirements.txt

      - name: Check the student code
        run: python scripts/check_code.py

      - name: Build strictly and check nothing loads from the internet
        run: python scripts/package.py

      - name: Check the diagrams
        env:
          EDGE: google-chrome
        run: python scripts/check_diagrams.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
